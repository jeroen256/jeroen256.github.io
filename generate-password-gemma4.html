<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strong Password Generator</title>
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --border: #e2e8f0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }

        h1 {
            margin-top: 0;
            font-size: 1.5rem;
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .result-container {
            background: #f1f5f9;
            padding: 1rem;
            border-radius: 0.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            border: 1px solid var(--border);
            word-break: break-all;
        }

        #password-display {
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--primary);
        }

        .copy-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 0.375rem;
            cursor: pointer;
            transition: background 0.2s;
            margin-left: 0.5rem;
        }

        .copy-btn:hover {
            background: var(--primary-hover);
        }

        .copy-btn:active {
            transform: scale(0.95);
        }

        .settings {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .setting-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .setting-item label {
            font-weight: 500;
        }

        input[type="range"] {
            width: 100%;
            margin: 0.5rem 0;
        }

        .checkbox-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.8rem;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.9rem;
        }

        .generate-btn {
            width: 100%;
            padding: 1rem;
            margin-top: 1.5rem;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 0.5rem;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .generate-btn:hover {
            background: var(--primary-hover);
        }

        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #334155;
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 2rem;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Password Generator</h1>
        
        <div class="result-container">
            <span id="password-display">Click Generate</span>
            <button class="copy-btn" id="copy-btn" title="Copy to clipboard">Copy</button>
        </div>

        <div class="settings">
            <div class="setting-item">
                <label>Length: <span id="length-val">16</span></label>
                <input type="range" id="length" min="8" max="64" value="16">
            </div>

            <div class="checkbox-group">
                <div class="checkbox-item">
                    <input type="checkbox" id="uppercase" checked>
                    <label for="uppercase">Uppercase</label>
                </div>
                <div class="checkbox-item">
                    <input type="checkbox" id="lowercase" checked>
                    <label for="lowercase">Lowercase</label>
                </div>
                <div class="checkbox-item">
                    <input type="checkbox" id="numbers" checked>
                    <label for="numbers">Numbers</label>
                </div>
                <div class="checkbox-item">
                    <input type="checkbox" id="symbols" checked>
                    <label for="symbols">Symbols</label>
                </div>
            </div>

            <button class="generate-btn" id="generate-btn">Generate Password</button>
        </div>
    </div>

    <div id="toast" class="toast">Copied to clipboard!</div>

    <script>
        const passwordDisplay = document.getElementById('password-display');
        const lengthInput = document.getElementById('length');
        const lengthVal = document.getElementById('length-val');
        const generateBtn = document.getElementById('generate-btn');
        const copyBtn = document.getElementById('copy-btn');
        const toast = document.getElementById('toast');

        const charSets = {
            uppercase: "ABCDEFGHIJKLMNOPQRSTUVWXYZ",
            lowercase: "abcdefghijklmnopqrstuvwxyz",
            numbers: "0123456789",
            symbols: "!@#$%^&*()_+=-{}[]|\\:;\"'<>,.?/"
        };

        // Update length label and generate password immediately
        lengthInput.addEventListener('input', () => {
            lengthVal.textContent = lengthInput.value;
            generatePassword();
        });

        // Generate password immediately when checkboxes change
        ['uppercase', 'lowercase', 'numbers', 'symbols'].forEach(id => {
            document.getElementById(id).addEventListener('change', generatePassword);
        });

        function generatePassword() {
            let charPool = "";
            if (document.getElementById('uppercase').checked) charPool += charSets.uppercase;
            if (document.getElementById('lowercase').checked) charPool += charSets.lowercase;
            if (document.getElementById('numbers').checked) charPool += charSets.numbers;
            if (document.getElementById('symbols').checked) charPool += charSets.symbols;

            if (charPool === "") {
                passwordDisplay.textContent = "Select options!";
                return;
            }

            let password = "";
            const length = parseInt(lengthInput.value);
            
            for (let i = 0; i < length; i++) {
                const randomIndex = Math.floor(Math.random() * charPool.length);
                password += charPool[randomIndex];
            }

            passwordDisplay.textContent = password;
        }

        generateBtn.addEventListener('click', generatePassword);

        copyBtn.addEventListener('click', () => {
            const text = passwordDisplay.textContent;
            if (text === "Click Generate" || text === "Select options!") return;

            navigator.clipboard.writeText(text).then(() => {
                toast.style.opacity = "1";
                setTimeout(() => {
                    toast.style.opacity = "0";
                }, 2000);
            });
        });

        // Generate one on load
        generatePassword();
    </script>
</body>
</html>
