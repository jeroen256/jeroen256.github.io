<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #121212; color: #e0e0e0;
            min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.5rem;
        }
        .container {
            background: #1e1e1e; border-radius: 8px; padding: 2rem 1.5rem;
            max-width: 400px; width: 100%; box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }
        h1 { text-align: center; font-size: 1.25rem; margin-bottom: 1.5rem; color: #007acc; }
        .length-control { display: flex; align-items: center; gap: 8px; margin-top: 1rem; flex-wrap: wrap;}
        .length-label { font-size: 0.9rem; color: #aaa; }
        input[type="range"] { width: 120px; accent-color: #007acc; }
        .value-display { min-width: 40px; text-align: center; font-size: 0.95rem; color: #007acc; font-weight: bold;}
        ul { list-style-type: none; margin-top: 1.5rem; padding: 1rem; background: #2a2a2a; border-radius: 6px; }
        li { display: flex; align-items: center; justify-content: space-between; padding: 0.5rem 0; font-size: 0.85rem; color: #ccc; cursor: pointer; transition: background 0.2s ease;}
        li:hover { background: #333; }
        .option-name{flex-shrink:0}
        input[type="checkbox"] { margin-right: 0.75rem; width: 18px; height: 18px; accent-color: #007acc; cursor: pointer;}
        .password-display { margin-top: 2rem; padding: 1rem; background: #1e1e1e; border-left: 4px solid #007acc; border-radius: 6px; }
        .current-password { font-family: 'Monaco', 'Consolas' monospace; font-size: 1.4rem; color: #fff; text-align: center; word-break: break-all;}
        .stats-box { margin-top: 0.5rem; padding: 1rem; border-radius: 6px; background: #2a2a2a;}
        button { width: 100%; background: #007acc; color: white; border: none; padding: 0.75rem; margin-top: 1rem; font-size: 1.1rem; font-weight: bold; border-radius: 8px; cursor: pointer;}
        button:hover { background: #0062a3; }
    </style>
</head>
<body>
<div class="container">
    <h1>Password Generator</h1>
    
    <div style="display:flex;align-items:center;gap:8px;margin-top:1rem;">
        <label for="length" style="color:#aaa;font-size:0.9rem;">Length:</label>
        <input type="range" id="length" min="8" max="64" value="32">
        <span id="lengthDisplay" style="min-width:40px;text-align:center;color:#007acc;font-size:0.95rem;font-weight:bold;">32</span>
    </div>

    <ul style="margin-top:1.5rem;padding:1rem;background:#2a2a2a;border-radius:6px;">
        <li><span>Uppercase (A-Z)</span> <input type="checkbox" id="uppercase" checked></li>
        <li><span>Lowercase (a-z)</span> <input type="checkbox" id="lowercase"></li>
        <li><span>Numbers (0-9)</span> <input type="checkbox" id="numbers"></li>
        <li><span>Special (!@#$...)</span> <input type="checkbox" id="special"></li>
    </ul>

    <div class="password-display"><div class="current-password" id="passwordDisplay"></div></div>
    
    <div class="stats-box">
        <span id="entropyValue">0</span> bits entropy<br><br>
        <span id="bruteForceEstimate"></span>
    </div>

    <button onclick="copyPassword()">Copy Password to Clipboard</button>
</div>

<script>
const UPPER = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
const LOWER = 'abcdefghijklmnopqrstuvwxyz';
const NUMBERS = '0123456789';
const SPECIAL = '!@#$%^&*()_+{}|:"<>?~`-[]/\\,.';

function generatePassword() {
    const length = parseInt(document.getElementById('length').value);
    const useUpper = document.getElementById('uppercase').checked;
    const useLower = document.getElementById('lowercase').checked;
    const useNums = document.getElementById('numbers').checked;
    const useSpec = document.getElementById('special').checked;

    if (!useUpper && !useLower && !useNums && !useSpec) {
        alert('Select at least one character type!');
        return;
    }
    
    if (length < 8) {
        alert('Minimum length is 8 characters!');
        document.getElementById('length').value = 8;
        document.getElementById('lengthDisplay').textContent = '8';
        return;
    }

    let charset = '';
    if (useUpper) charset += UPPER;
    if (useLower) charset += LOWER;
    if (useNums) charset += NUMBERS;
    // Only add special chars if other options are enabled
    let useSpecialOnly = true;
    if ((useUpper || useLower || useNums)) {
        useSpecialOnly = document.getElementById('special').checked;
    }
    
    if (useSpecialOnly) charset += SPECIAL;

    let password = '';
    for (let i = 0; i < length; i++) {
        const randomIndex = Math.floor(Math.random() * charset.length);
        password += charset[randomIndex];
    }

    document.getElementById('passwordDisplay').textContent = password;
    
    // Calculate entropy
    const charsetSize = UPPER.length + LOWER.length + NUMBERS.length + (useSpecialOnly ? SPECIAL.length : 1);
    const entropy = Math.floor(length * Math.log2(charsetSize));
    document.getElementById('entropyValue').textContent = entropy;

    let bfEstimate = '';
    if (length >= 30 && charsetSize > 65) {
        bfEstimate = 'Unbreakable - virtually infinite protection';
    } else if (entropy >= 120) {
        bfEstimate = '> trillion attempts\n(Secure for lifetime)';
    } else if (entropy >= 80) {
        bfEstimate = '> billion attempts\n(Strong password)';
    } else {
        bfEstimate = 'Consider using at least 24 chars';
    }
    document.getElementById('bruteForceEstimate').textContent = bfEstimate;
}

function copyPassword() {
    const password = document.getElementById('passwordDisplay').textContent;
    const textarea = document.createElement('textarea');
    textarea.value = password;
    textarea.style.position = 'fixed';
    textarea.style.opacity = '0';
    textarea.style.right = '-1px';
    document.body.appendChild(textarea);

    try {
        textarea.select();
        document.execCommand('copy');
        
        const notif = document.createElement('div');
        notif.style.cssText = `position:fixed;top:1rem;left:50%;transform:translateX(-50%);background:#007acc;color:white;padding:1rem 2rem;border-radius:8px;font-weight:bold;z-index:9999;`;
        notif.textContent = 'Password copied!';
        document.body.appendChild(notif);

        setTimeout(() => {
            textarea.remove();
            notif.style.opacity = '0';
            setTimeout(() => notif.remove(), 300);
        }, 1500);
    } catch (e) {
        alert('Could not copy. Long press select manually.');
    }

    textarea.remove();
}

window.onload = () => {
    generatePassword();
    
    document.getElementById('length').oninput = function() {
        document.getElementById('lengthDisplay').textContent = this.value;
        generatePassword();
    };

    // Add listeners to checkboxes - use click event, don't prevent default check
    ['uppercase', 'lowercase', 'numbers', 'special'].forEach(id => {
        document.getElementById(id).addEventListener('click', generatePassword);
    });
};
</script>
</body>
</html>
