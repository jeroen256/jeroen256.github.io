<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator 🔑</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #121212;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .container {
            background: #1e1e1e;
            border-radius: 8px;
            padding: 2rem 1.5rem;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        h1 {
            text-align: center;
            font-size: 1.25rem;
            margin-bottom: 1.5rem;
            color: #007acc;
        }

        .length-control {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-top: 1rem;
        }

        .length-label {
            font-size: 0.9rem;
            color: #aaa;
        }

        input[type="range"] {
            width: 120px;
            accent-color: #007acc;
        }

        .value-display {
            min-width: 40px;
            text-align: center;
            font-size: 0.95rem;
            color: #007acc;
            font-weight: bold;
        }

        ul {
            list-style-type: none;
            margin-top: 1.5rem;
            padding: 1rem;
            background: #2a2a2a;
            border-radius: 6px;
        }

        li {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.5rem 0;
            font-size: 0.85rem;
            color: #ccc;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        li:hover {
            background: #333;
        }

        .option-name {
            flex-shrink: 0;
        }

        input[type="checkbox"] {
            margin-right: 0.75rem;
            width: 18px;
            height: 18px;
            accent-color: #007acc;
            cursor: pointer;
        }

        .password-display {
            margin-top: 2rem;
            padding: 1rem;
            background: #1e1e1e;
            border-left: 4px solid #007acc;
            border-radius: 6px;
            max-height: 150px;
            overflow: hidden;
        }

        .current-password {
            font-family: 'Monaco', 'Consolas', monospace;
            font-size: 1.4rem;
            color: #fff;
            text-align: center;
            word-break: break-all;
            line-height: 1.5;
        }

        button {
            width: 100%;
            background: #007acc;
            color: white;
            border: none;
            padding: 0.75rem;
            margin-top: 2rem;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background: #0062a3;
        }

    </style>
</head>
<body>

<div class="container">
    <h1>Password Generator 🔑</h1>

    <!-- Length Control -->
    <div class="length-control">
        <label for="length" class="length-label">Length:</label>
        <input type="range" id="length" min="8" max="64" value="32">
        <span class="value-display" id="lengthDisplay">32</span>
    </div>

    <!-- Character Options -->
    <ul id="optionsList">
        <li><span class="option-name">Uppercase (A-Z)</span> <input type="checkbox" id="uppercase"></li>
        <li><span class="option-name">Lowercase (a-z)</span> <input type="checkbox" id="lowercase"></li>
        <li><span class="option-name">Numbers (0-9)</span> <input type="checkbox" id="numbers"></li>
        <li><span class="option-name">Special Chars (!@#$...)</span> <input type="checkbox" id="special"></li>
    </ul>

    <!-- Password Display -->
    <div class="password-display">
        <div class="current-password" id="passwordDisplay"></div>
    </div>

    <!-- Copy Button -->
    <button onclick="copyPassword()">📋 Copy to Clipboard</button>
</div>

<script>
    // Character sets
    const upper = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    const lower = 'abcdefghijklmnopqrstuvwxyz';
    const numbers = '0123456789';
    const special = '!@#$%^&*()_+{}|:\"<>?~`-[]/\\,.';

    // Get character codes from checkboxes
    function getCharsetOptions() {
        const options = {};
        if (document.getElementById('uppercase').checked) options.upper = upper.length;
        if (document.getElementById('lowercase').checked) options.lower = lower.length;
        if (document.getElementById('numbers').checked) options.numbers = numbers.length;
        if (document.getElementById('special').checked) options.special = special.length;
        
        return options;
    }

    // Generate password
    function generatePassword() {
        const length = parseInt(document.getElementById('length').value);
        const opts = getCharsetOptions();

        // Ensure at least one character type is selected and minimum 8 chars required
        if (Object.keys(opts).length === 0 || length < 8) {
            alert('Please select at least one character type and require minimum 8 characters!');
            return;
        }

        const charset = [];
        for (const [key, value] of Object.entries(opts)) {
            for (let i = 0; i < value; i++) {
                charset.push(charset[key === 'upper' && opts.lower > 1 ? 'lower' : key]);
            }
        }

        let password = '';
        
        for (let i = 0; i < length; i++) {
            const randomIndex = Math.floor(Math.random() * charset.length);
            password += charset[randomIndex];
        }

        document.getElementById('passwordDisplay').textContent = password;
    }

    // Calculate and display statistics
    function calculateStats(password) {
        const length = password.length;
        const opts = getCharsetOptions();
        let charsetSize = 0;
        Object.values(opts).forEach(size => {
            charsetSize += size;
        });

        const entropy = Math.floor(length * Math.log2(charsetSize)); // bits of entropy
        
        document.getElementById('entropyValue').textContent = entropy + ' bits';

        let bfEstimate = '';
        if (length >= 20 && charsetSize > 70) {
            bfEstimate = '> 10^85 attempts\n(Million years to crack with all GPU farms on Earth)';
        } else if (length >= 16 && length <= 20) {
            bfEstimate = `> ${Math.pow(charsetSize, length).toLocaleString('en-US')}\n(Still billions per year even on modern hardware)`;
        } else if (length >= 12 && charsetSize > 50) {
            bfEstimate = `> ${Math.pow(charsetSize, length).toLocaleString('en-US')}\n(Breakable with dedicated attacks in ~74 years)`;
        } else if (length < 16) {
            bfEstimate = 'Consider using at least 20+ chars for unbreakable protection';
        }

        document.getElementById('bruteForceEstimate').innerHTML = bfEstimate;
    }

    // Copy to clipboard
    async function copyPassword() {
        const password = document.getElementById('passwordDisplay').textContent;
        
        try {
            await navigator.clipboard.writeText(password);
        } catch (err) {
            alert('Browser does not support clipboard API. Please select and copy manually.');
            return;
        }

        // Show notification
        const notif = document.createElement('div');
        notif.style.cssText = `position:fixed;top:1rem;left:50%;transform:translateX(-50%);background:#007acc;color:white;padding:1rem 2rem;border-radius:8px;font-weight:bold;z-index:9999;`;
        notif.textContent = '✅ Password copied!';
        document.body.appendChild(notif);

        setTimeout(() => {
            notif.style.opacity = '0';
            setTimeout(() => notif.remove(), 300);
        }, 1500);
    }

    // Initialize on load
    window.onload = () => {
        document.getElementById('uppercase').checked = true;
        document.getElementById('lowercase').checked = true;
        document.getElementById('numbers').checked = false;
        document.getElementById('special').checked = false;
        
        generatePassword();
        
        document.getElementById('length').oninput = function() {
            document.getElementById('lengthDisplay').textContent = this.value;
            generatePassword();
        };
    }

</script>

</body>
</html>
